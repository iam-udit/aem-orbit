name: Bug report
description: Create a report to help us improve AEM Orbit
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: input
    id: environment
    attributes:
      label: AEM Version & Environment
      description: E.g., AEM as a Cloud Service, AEM 6.5.18 on-premise, Local Quickstart.
      placeholder: AEM as a Cloud Service
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser Version
      description: E.g., Google Chrome 130.0 (arm64)
      placeholder: Chrome 130
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open an author page at `/editor.html/content/...`
        2. Open Orbit toolbar or popup
        3. Click 'Publish to Preview'
        4. See error in toast notification
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
